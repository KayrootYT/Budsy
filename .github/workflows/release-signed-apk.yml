name: Signed Budsy Release APK

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: signed-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Locate and extract Budsy project ZIP
        id: project
        shell: bash
        run: |
          set -euo pipefail
          archive="$(find . -maxdepth 2 -type f -iname 'Budsy.zip' -not -path './.git/*' | head -n 1 || true)"
          if [ -z "$archive" ]; then
            echo '::error::Budsy.zip was not found in the repository root.'
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/budsy-src"
          unzip -q "$archive" -d "$RUNNER_TEMP/budsy-src"
          settings="$(find "$RUNNER_TEMP/budsy-src" -type f -name settings.gradle.kts -not -path '*/.gradle/*' | head -n 1 || true)"
          if [ -z "$settings" ]; then
            echo '::error::settings.gradle.kts not found inside Budsy.zip.'
            exit 1
          fi
          project_dir="$(dirname "$settings")"
          test -f "$project_dir/app/build.gradle.kts"
          echo "dir=$project_dir" >> "$GITHUB_OUTPUT"
          echo "Project directory: $project_dir"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Accept Android licenses
        run: yes | sdkmanager --licenses >/dev/null || true

      - name: Decode and validate release keystore
        shell: bash
        env:
          BUDSY_KEYSTORE_BASE64: ${{ secrets.BUDSY_KEYSTORE_BASE64 }}
          BUDSY_STORE_PASSWORD: ${{ secrets.BUDSY_STORE_PASSWORD }}
          BUDSY_KEY_ALIAS: ${{ secrets.BUDSY_KEY_ALIAS }}
          BUDSY_KEY_PASSWORD: ${{ secrets.BUDSY_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for name in BUDSY_KEYSTORE_BASE64 BUDSY_STORE_PASSWORD BUDSY_KEY_ALIAS BUDSY_KEY_PASSWORD; do
            if [ -z "${!name:-}" ]; then
              echo "::error::Missing required Actions secret: $name"
              exit 1
            fi
          done
          key_path="$RUNNER_TEMP/budsy-release.jks"
          printf '%s' "$BUDSY_KEYSTORE_BASE64" | base64 --decode > "$key_path"
          test -s "$key_path"
          keytool -list -keystore "$key_path" -storepass "$BUDSY_STORE_PASSWORD" -alias "$BUDSY_KEY_ALIAS" >/dev/null
          echo "BUDSY_STORE_FILE=$key_path" >> "$GITHUB_ENV"
          echo 'Release keystore validated.'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Run tests and build signed release APK
        working-directory: ${{ steps.project.outputs.dir }}
        run: gradle --no-daemon --stacktrace clean testReleaseUnitTest assembleRelease
        env:
          BUDSY_STORE_PASSWORD: ${{ secrets.BUDSY_STORE_PASSWORD }}
          BUDSY_KEY_ALIAS: ${{ secrets.BUDSY_KEY_ALIAS }}
          BUDSY_KEY_PASSWORD: ${{ secrets.BUDSY_KEY_PASSWORD }}

      - name: Verify APK signature
        working-directory: ${{ steps.project.outputs.dir }}
        shell: bash
        run: |
          set -euo pipefail
          apk='app/build/outputs/apk/release/app-release.apk'
          test -s "$apk"
          apksigner verify --verbose --print-certs "$apk"
          cp "$apk" "$GITHUB_WORKSPACE/Budsy-release-signed.apk"

      - name: Upload signed APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Budsy-release-signed
          path: Budsy-release-signed.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload build reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: budsy-release-build-reports
          path: ${{ steps.project.outputs.dir }}/app/build/reports
          if-no-files-found: ignore
