name: Build Budsy APK

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Select project source (prefer Budsy.zip)
        id: project
        shell: bash
        run: |
          set -euo pipefail
          rm -rf _project
          archive="$(find . -maxdepth 2 -type f \( -iname 'Budsy.zip' -o -iname 'budsy.zip' \) -not -path './.git/*' | head -n 1 || true)"
          if [ -n "$archive" ]; then
            echo "Using project archive: $archive"
            mkdir -p _project
            unzip -q -o "$archive" -d _project
            root="_project"
          else
            echo "Budsy.zip not found; using checked-out project files"
            root="."
          fi
          settings="$(find "$root" -type f -name settings.gradle.kts -not -path '*/.gradle/*' -not -path '*/build/*' | head -n 1 || true)"
          if [ -z "$settings" ]; then
            echo '::error::settings.gradle.kts not found in Budsy.zip or repository.'
            find "$root" -maxdepth 4 -type f | head -100
            exit 1
          fi
          project_dir="$(dirname "$settings")"
          if [ ! -f "$project_dir/app/build.gradle.kts" ]; then
            echo "::error::Android module not found under $project_dir/app"
            find "$project_dir" -maxdepth 3 -type f | head -100
            exit 1
          fi
          echo "dir=$project_dir" >> "$GITHUB_OUTPUT"
          echo "Selected Gradle project: $project_dir"

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        run: sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Accept Android licenses
        run: yes | sdkmanager --licenses >/dev/null || true

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        working-directory: ${{ steps.project.outputs.dir }}
        run: gradle --no-daemon --stacktrace clean testDebugUnitTest assembleDebug

      - name: Verify APK exists and is non-empty
        working-directory: ${{ steps.project.outputs.dir }}
        run: test -s app/build/outputs/apk/debug/app-debug.apk

      - name: Copy APK using stable filename
        run: cp "${{ steps.project.outputs.dir }}/app/build/outputs/apk/debug/app-debug.apk" Budsy.apk

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: Budsy-apk
          path: Budsy.apk
          if-no-files-found: error

      - name: Upload build reports on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: build-reports
          path: |
            ${{ steps.project.outputs.dir }}/app/build/reports
            ${{ steps.project.outputs.dir }}/app/build/outputs/logs
          if-no-files-found: ignore
          
